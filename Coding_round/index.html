    <script>
      //Two Sum

      function greet(name) {

      greet("Ritik !");

      //Shopping cart total
      const cart = [
        { name: "Book", price: 12.99 },
        { name: "Headphones", price: 29.99 },

      let total = 0;

      for (items of cart) {
        total += items.price;

      //Reverse string
      let str = "Ritik";
      let reversed = "";

      for (let i = str.length - 1; i >= 0; i--) {
        reversed += str[i];
      }

      console.log(reversed);

      //word count

      let text = "Ritikjain";
      let word = text.trim().split("");
      console.log(word.length);

      //Even number filter

      let nums = [2, 4, 73, 36, 63, 28, 4, 63];
      let evens = nums.filter((n) => n % 2 == 0);
      console.log(evens);

      //Sum with reduce

      const totalSum = nums.reduce((acc, n) => acc + n, 0);
      console.log(totalSum);

      //unique value with set
      const unique = [...new Set(nums)];
      console.log(unique);
      let ul = document.querySelector("ul");
      const tasks = ["apple", "banana", "graps"];
      tasks.forEach((task) => {
        const li = document.createElement("li");
        li.innerText = task;
        ul.appendChild(li);
      });

      //show hide toggle
      const btn = document.querySelector("button");
      const pera = document.querySelector("p");
      btn.addEventListener("click", () => {
        pera.classList.toggle("hidden");
      });

      // Form validation
      let email = document.getElementById("email");
      let password = document.getElementById("pass"); // ✅ fixed
      let form = document.querySelector("form");

      form.addEventListener("submit", (e) => {
        e.preventDefault();

        if (!email.value || !password.value) {
          alert("please fill all the fields");
        } else {
          alert("form submitted successfully");
          form.reset();
        }
      });

      //persist click counter

      let countbtn = document.getElementById("countbtn");
      let totalcount = document.getElementById("totalcount");
      let totalcnt = Number(localStorage.getItem("count")) || 0;
      totalcount.textContent = totalcnt;

      countbtn.addEventListener("click", () => {
        totalcnt++;
        totalcount.textContent = totalcnt;
        localStorage.setItem("count", totalcnt);
      });

      //FizzBuzz
      for (let i = 0; i <= 100; i++) {
        if (i % 15 == 0) {
          console.log("FizzBuzz");
        } else if (i % 5 == 0) {
          console.log("Fizz");
        } else if (i % 3 == 0) {
          console.log("Buzz");
        } else {
          console.log(i);
        }
      }

      //Palindrom checker

      function isPalindrome(word) {
        const str = word.toLowerCase().trim();
        const reverse = str.split("").reverse().join("");
        console.log(str === reverse);
      }

      isPalindrome("naman");
      isPalindrome("Rahul");
      isPalindrome("eye");

      //factorial
      let result = 1;
      function factorial(n) {
        if (!Number.isInteger(n) || n < 0) {
          return "Not a valid number";
        } else {
          for (let i = 2; i <= n; i++) result *= i;
        }
        return result;
      }
      console.log(factorial("a"));
      console.log(factorial(5));
      console.log(factorial(7));

      //fibonacci series
      function fibbo(n) {
        if (!Number.isInteger(n) || n < 0) return [];
        if (n === 1) {
          return [0];
        }
        const seq = [0, 1];
        while (seq.length < n) {
          seq.push(seq[seq.length - 1] + seq[seq.length - 2]);
        }
        return seq;
      }
      console.log(fibbo(1));
      console.log(fibbo(4));

      //count character frequency
      function frequency(text) {
        freq = {};
        for (ch of text) {
          freq[ch] = (freq[ch] || 0) + 1;
        }
        return freq;
      }
      console.log(frequency("banana"));

      //sorting without sort fn

      function bubbleSort(ar) {
        for (let i = 0; i < ar.length - 1; i++) {
          for (let j = 0; j < ar.length - 1 - i; j++) {
            if (ar[j] > ar[j + 1]) {
              [ar[j], ar[j + 1]] = [ar[j + 1], ar[j]];
            }
          }
        }
        return ar;
      }
      console.log(bubbleSort([1, 3, 2, 4, 34, 234, 23, 45, 22]));

      //unique element
      function uniqueElem(arry) {
        result = [];
        for (const item of arry) {
          if (!result.includes(item)) {
            result.push(item);
          }
        }
        return result;
      }
      console.log(uniqueElem([1, 1, 23, 43, 23, 43]));

      //safe  json parse

      function safeJsonParse(str) {
        try {
          return { true: JSON.parse(str) };
        } catch (err){
          return {  false: err.message };
        }
      }
      console.log(safeJsonParse('{"a":1}'));
      console.log(safeJsonParse("{bad json}"));
    </script>
