    <script>
      //Two Sum
      const num1 = 5;
      const num2 = 4;

      const sum = num1 + num2;
      console.log(sum);

      //Even & odd
      const num = 34;
      if (num % 2 == 0) {
        console.log("Number is even");
      } else {
        console.log("Number is odd");
      }

      //Count Down

      let x = 8;
      for (let i = x; i > 0; i--) {
        console.log(i);
      }

      //Maximum of array

      let arr = [3, 5, 9, 15];
      let max = arr[0];
      for (let i = 1; i < arr.length; i++) {
        if (arr[i] > max) {
          max = arr[i];
        }
      }
      console.log(max);

      //Greating function
      function greet(name) {
        console.log("Hello " + name);
      }
      greet("Ritik !");

      //Shopping cart total
      const cart = [
        { name: "Book", price: 12.99 },
        { name: "Headphones", price: 29.99 },
      ];

      let total = 0;

      for (items of cart) {
        total += items.price;
      }
      console.log(total);

      //Reverse string
      let str = "Ritik";
      let reversed = "";

      for (let i = str.length - 1; i >= 0; i--) {
        reversed += str[i];
      }

      console.log(reversed);

      //word count

      let text = "Ritikjain";
      let word = text.trim().split("");
      console.log(word.length);
