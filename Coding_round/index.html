<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Coding Practice</title>
    <style>
      .hidden {
        display: none;
      }
    </style>
  </head>
  <body>
    <ul></ul>
    <button>Toggle Button</button>
    <p>
      Lorem ipsum dolor sit amet consectetur, adipisicing elit. Ad non culpa
      accusantium ex, illo rerum eius labore officiis! Eaque nostrum placeat
      quaerat cupiditate fugiat. Dolorem quasi aliquid dolores similique nulla.
    </p>
    <form action="" method="get">
      <input type="email" name="" id="email" />
      <input type="password" name="" id="pass" />
      <button type="submit" id="submit">Submit</button>
    </form>
    <button type="button" id="countbtn">count</button>
    <p id="totalcount"></p>
    <script>
      //Two Sum
      const num1 = 5;
      const num2 = 4;

      const sum = num1 + num2;
      console.log(sum);

      //Even & odd
      const num = 34;
      if (num % 2 == 0) {
        console.log("Number is even");
      } else {
        console.log("Number is odd");
      }

      //Count Down

      let x = 8;
      for (let i = x; i > 0; i--) {
        console.log(i);
      }

      //Maximum of array

      let arr = [3, 5, 9, 15];
      let max = arr[0];
      for (let i = 1; i < arr.length; i++) {
        if (arr[i] > max) {
          max = arr[i];
        }
      }
      console.log(max);

      //Greating function
      function greet(name) {
        console.log("Hello " + name);
      }
      greet("Ritik !");

      //Shopping cart total
      const cart = [
        { name: "Book", price: 12.99 },
        { name: "Headphones", price: 29.99 },
      ];

      let total = 0;

      for (items of cart) {
        total += items.price;
      }
      console.log(total);

      //Reverse string
      let str = "Ritik";
      let reversed = "";

      for (let i = str.length - 1; i >= 0; i--) {
        reversed += str[i];
      }

      console.log(reversed);

      //word count

      let text = "Ritikjain";
      let word = text.trim().split("");
      console.log(word.length);

      //       guess number

      //       let number = Math.floor(Math.random() * 20) + 1;
      //       let guess;

      //       while (guess !== number) {
      //         guess = Number(prompt("Enter your Number:"));
      //       if(guess<number)
      //         alert("Too Low");
      //     else if(guess>number)
      //       alert("too high")
      //   else
      //     alert("Correct !");
      // }

      //Even number filter

      let nums = [2, 4, 73, 36, 63, 28, 4, 63];
      let evens = nums.filter((n) => n % 2 == 0);
      console.log(evens);

      //Sum with reduce

      const totalSum = nums.reduce((acc, n) => acc + n, 0);
      console.log(totalSum);

      //unique value with set
      const unique = [...new Set(nums)];
      console.log(unique);
      let ul = document.querySelector("ul");
      const tasks = ["apple", "banana", "graps"];
      tasks.forEach((task) => {
        const li = document.createElement("li");
        li.innerText = task;
        ul.appendChild(li);
      });

      //show hide toggle
      const btn = document.querySelector("button");
      const pera = document.querySelector("p");
      btn.addEventListener("click", () => {
        pera.classList.toggle("hidden");
      });

      // Form validation
      let email = document.getElementById("email");
      let password = document.getElementById("pass"); // ✅ fixed
      let form = document.querySelector("form");

      form.addEventListener("submit", (e) => {
        e.preventDefault();

        if (!email.value || !password.value) {
          alert("please fill all the fields");
        } else {
          alert("form submitted successfully");
          form.reset();
        }
      });

      //persist click counter

      let countbtn = document.getElementById("countbtn");
      let totalcount = document.getElementById("totalcount");
      let totalcnt = Number(localStorage.getItem("count")) || 0;
      totalcount.textContent = totalcnt;

      countbtn.addEventListener("click", () => {
        totalcnt++;
        totalcount.textContent = totalcnt;
        localStorage.setItem("count", totalcnt);
      });

      //FizzBuzz
      for (let i = 0; i <= 100; i++) {
        if (i % 15 == 0) {
          console.log("FizzBuzz");
        } else if (i % 5 == 0) {
          console.log("Fizz");
        } else if (i % 3 == 0) {
          console.log("Buzz");
        } else {
          console.log(i);
        }
      }
    </script>
  </body>
</html>
